# fastapi_server라는 서비스 정의, 이름을 임의로 구성
upstream fastapi_server {
    # server는 app(was 컨테이너의 서비스명): 8000 url 정의
    server app:8000;
}

server {
    # web 서버는 80 바라보고 요청 체크
    listen       80;
    listen  [::]:80;
    # 도메인명을 localhost 구성
    server_name  localhost;

    # 규칙 구성
    location / {
        # 80 요청은 fastapi_server로 프록시(강제 포워딩 하겠다) : 80 => 8000
        proxy_pass http://fastapi_server;
        
        # http 프로토콜 특정 정보들에 대한 전달 표기 (복사하여 사용)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}