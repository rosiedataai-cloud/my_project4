name: Push 기반 CI/CD 테스트

# 트리거 지정, CI/CD가 작동하게 되는 원인, 이벤트->on 정의
# main 브런치에서 사용자가 push 행위를 실행하면 -> 트리거 발동 -> 아래 설정한 내용 작동(CI/CD)

# Create 브런치에서 push 이벤트 발생시 처리(작동)
on:
    push:
      # 브런치가 n개로 늘어나는 경우 효율적 표현
        branches: ["Create"]


# 개별 작업 (파이프라인)
jobs:
    # cicd 작업(이름)
    ci:
      runs-on: ubuntu-latest
      steps:
          # 1. 소스코드 체크아웃, 소스 코드를 ci 서버에 다운로드
         -  name: 코드 checkout
            uses: actions/checkout@v5
          # 2. 도커허브 로그인
          # 3. fastapi app 이미지 빌드 푸시
          # 4. nginx proxy 이미지 빌드 푸시
      

    cd:
      # ci 작업이 완료된 후 진행됨 -> 의존성 기술
      needs: ci
      runs-on: ubuntu-latest
      steps:
          # 1. 소스코드 체크아웃, 소스 코드를 ci 서버에 다운로드
         -  name: 코드 checkout
            uses: actions/checkout@v5
          # 2. docker-compose.yml 파일만 ec2 서버에 copy
          # 3. ec2 서버에서 컨테이너 교체, 미사용 이미지 제거