name: Push 기반 CI/CD 테스트

# 트리거 지정, CI/CD가 작동하게 되는 원인, 이벤트->on 정의
# main 브런치에서 사용자가 push 행위를 실행하면 -> 트리거 발동 -> 아래 설정한 내용 작동(CI/CD)
on:
    push:
        branches:
            - main

# 개별 작업 (파이프라인)
jobs:
    # cicd 작업(이름)
    cicd:
       # 어떤 작업을 수행하려면, 머신, OS등 필요 -> 머신 Github Action 제공(무료), OS 지정
       runs-on: ubuntu-latest

       # 세부 작업 지정
       steps:
            # CI 작업 (대부분 주요 작업 생략했음)
            # 1. github에 저장되어 있는 최신 내용을 체크아웃 (소스코드 모두 다운로드)
            - name: 코드 checkout
              uses: actions/checkout@v5
            
            # 2. checkout 여부 검증
            - name: 소스코드 확인 검증
              # 여러개의 리눅스 명령 활용 => | 활용
              run:  |
                pwd
                ls -al
                cat main.py
              shell:  bash
            
            # 3. 지속적 통합 -> 빌드, 단위테스트 수행, 기타 작업 ... (생략) 

            # CD 작업( AWS EC2 서버에 배포 -> xxx.pem 필요 )
            # pem 파일을 이용하여 aws ec2 인스턴스에 접속 확인
            # pem 파일의 내용, ec2 서버의 host, 사용자명등 정보가 필요, ci서버에서 엑세스가능
            # github 내 특정 저장소내에 시크릿변수 구성
            - name: sourcecode copy to EC2
              uses: appleboy/scp-action@master
              with:
                # 시크릿 변수를 가져와서 설정 내용
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.EC2_KEY }}
                port: 22
                # 편의상 현재 디렉토리의 모든 내용 카피
                source: .                
                # aws ec2 서버의 특정위치에 카피
                # /home/ubuntu/projects/*.* 세팅
                target: "/home/ubuntu/projects"